<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Canyon Rim</title>
  <meta name="description" content="Happy Canyon Rim — a historic family ranch in the American West. Help us preserve this landscape for future generations.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
  <style>
    /* === Reset & Base === */
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --color-bg: #FAF3E8;
      --color-text: #2C1810;
      --color-accent: #C2452D;
      --color-secondary: #8B6914;
      --color-muted: #A0927B;
      --color-overlay: rgba(44, 24, 16, 0.55);
      --font-heading: 'Playfair Display', Georgia, serif;
      --font-body: 'Lato', 'Segoe UI', sans-serif;
      --max-width: 900px;
      --section-padding: 100px 24px;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: var(--font-body);
      color: var(--color-text);
      background-color: var(--color-bg);
      line-height: 1.7;
      font-size: 18px;
      -webkit-font-smoothing: antialiased;
    }

    h1, h2, h3 {
      font-family: var(--font-heading);
      font-weight: 700;
      line-height: 1.2;
    }

    img {
      max-width: 100%;
      height: auto;
      display: block;
    }

    a {
      color: var(--color-accent);
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    /* === Layout === */
    .container {
      max-width: var(--max-width);
      margin: 0 auto;
      padding: 0 24px;
    }

    .section {
      padding: var(--section-padding);
    }

    .section-title {
      font-size: 2.4rem;
      margin-bottom: 1rem;
      text-align: center;
    }

    /* === Section Divider === */
    .divider {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 0 24px;
    }

    .divider::before,
    .divider::after {
      content: '';
      flex: 1;
      max-width: 200px;
      height: 1px;
      background-color: var(--color-muted);
    }

    .divider-diamond {
      width: 10px;
      height: 10px;
      background-color: var(--color-muted);
      transform: rotate(45deg);
      flex-shrink: 0;
    }

    /* === Hero === */
    .hero {
      position: relative;
      height: 100vh;
      min-height: 500px;
      background-image: url('images/house.jpeg');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .hero-overlay {
      position: absolute;
      inset: 0;
      background: var(--color-overlay);
    }

    .hero-content {
      position: relative;
      z-index: 1;
      color: #FAF3E8;
      padding: 24px;
    }

    .hero-title {
      font-size: 4.5rem;
      font-weight: 900;
      letter-spacing: 0.02em;
      margin-bottom: 16px;
      text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.4);
    }

    .hero-tagline {
      font-family: var(--font-body);
      font-size: 1.3rem;
      font-weight: 300;
      letter-spacing: 0.05em;
      text-shadow: 1px 1px 4px rgba(0, 0, 0, 0.4);
    }

    /* === Responsive === */
    @media (max-width: 600px) {
      :root {
        --section-padding: 60px 16px;
      }

      body {
        font-size: 16px;
      }

      .section-title {
        font-size: 1.8rem;
      }

      .hero {
        background-attachment: scroll;
      }

      .hero-title {
        font-size: 2.5rem;
      }

      .hero-tagline {
        font-size: 1rem;
      }
    }
  </style>
</head>
<body>
  <!-- Hero -->
  <header class="hero">
    <div class="hero-overlay"></div>
    <div class="hero-content">
      <h1 class="hero-title">Happy Canyon Rim</h1>
      <p class="hero-tagline">A piece of the American West, preserved.</p>
    </div>
  </header>

  <script>
    // Lightbox JS will be added in Task 5
  </script>
</body>
</html>
